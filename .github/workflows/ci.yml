# Checks every push to develop and every pull request. Does not publish anything.
name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
