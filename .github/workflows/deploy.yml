# The calculator is published by Cloudflare (embalagem.bestgift.workers.dev),
# which builds main on its own. This keeps the old GitHub Pages address
# working: it publishes the page in redirect/, which forwards to the new one.
name: Forward old address

on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
